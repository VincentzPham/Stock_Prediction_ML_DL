name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh

    - name: Install dependencies
      run: |
        uv sync

    - name: Run Quick Test (ML only - fast)
      # Only run ML models in CI to save time/resources
      # DL models require GPU and too much time
      # TS models (ARIMA/Prophet) can be slow
      run: |
        uv run python scripts/train_all.py --ml-only --no-save --no-update-data -y

    - name: Build Docker images
      run: |
        docker compose build

    - name: Test Docker Compose
      run: |
        docker compose up -d
        sleep 10
        curl -f http://localhost:8000/ || exit 1
        docker compose down
