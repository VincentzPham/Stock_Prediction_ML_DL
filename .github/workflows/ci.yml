name: Machine Learning CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        
    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/install.sh | sh
      
    - name: Install dependencies
      run: uv sync
      
    - name: Run linting
      run: uv run ruff check backend/ frontend/ scripts/ tests/ --fix
      
    - name: Run tests
      run: uv run pytest tests/ -v --tb=short
      
    - name: Dry Run Training (Smoke Test)
      # Train LSTM for 1 ticker to ensure DL pipeline works
      timeout-minutes: 10
      continue-on-error: true
      run: |
        uv run python scripts/train_all.py --ticker AAPL --model LSTM --yes --no-save --no-update-data
